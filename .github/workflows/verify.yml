name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - agent/bootstrap-kmp-fitness-platform

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy-and-provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate default-deny contracts
        run: |
          python3 scripts/validate_repository.py
          python3 scripts/validate_taiwan_rule_pack.py
          python3 scripts/validate_taiwan_source_lifecycle.py
          python3 scripts/validate_taiwan_source_hardening.py
          python3 scripts/validate_stacked_delivery.py --self-test
          python3 data/exercise-catalog/validate_catalog.py
          python3 data/exercise-catalog/validate_catalog.py --selftest
          python3 scripts/validate_nutrition_catalog.py
          python3 scripts/validate_nutrition_catalog.py --self-test
          python3 scripts/validate_authority_surfaces.py
          python3 scripts/validate_authority_surfaces.py --self-test
          python3 scripts/validate_product_safety_authority.py
          python3 scripts/validate_product_safety_authority.py --self-test
          python3 scripts/validate_artifact_identity.py self-test

  android-web-domain:
    name: android-web-domain
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install stable Android API 36
        run: sdkmanager "platforms;android-36"
      - name: Shared domain tests
        run: sh ./gradlew :shared:jvmTest --stacktrace
      - name: Android debug and lint
        run: sh ./gradlew :androidApp:assembleDebug :androidApp:lintDebug --stacktrace
      - name: Browser compatibility distribution
        run: sh ./gradlew :webApp:composeCompatibilityBrowserDistribution --stacktrace
      - name: Emit Android and Web artifact identity receipts
        run: |
          mkdir -p build/evidence
          APK="$(find androidApp/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          python3 scripts/validate_artifact_identity.py apk "$APK" \
            --output build/evidence/android-artifact-identity.json
          python3 scripts/validate_artifact_identity.py tree webApp/build/dist \
            --output build/evidence/web-artifact-identity.json
      - name: Upload build identity receipts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-identities
          path: build/evidence/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android debug evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload web distribution evidence
        uses: actions/upload-artifact@v4
        with:
          name: web-compatibility-distribution
          path: webApp/build/dist/
          if-no-files-found: error
          retention-days: 7

  ios:
    name: ios-framework-and-host
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
          gradle --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Link Kotlin simulator framework
        run: sh ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Generate canonical Xcode project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml
      - name: Build unsigned simulator host
        working-directory: iosApp
        run: |
          xcodebuild \
            -project GymComeTrue.xcodeproj \
            -scheme GymComeTrue \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            build
