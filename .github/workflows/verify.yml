name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - agent/bootstrap-kmp-fitness-platform

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy-and-provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate default-deny contracts
        run: python3 scripts/validate_repository.py

  android-web-domain:
    name: android-web-domain
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: android-actions/setup-android@v3
      - name: Install Android API 37 preview
        run: sdkmanager --channel=3 "platforms;android-37"
      - name: Shared domain tests
        run: sh ./gradlew :shared:jvmTest --stacktrace
      - name: Android debug and lint
        run: sh ./gradlew :androidApp:assembleDebug :androidApp:lintDebug --stacktrace
      - name: Browser compatibility distribution
        run: sh ./gradlew :webApp:composeCompatibilityBrowserDistribution --stacktrace
      - name: Upload Android debug evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload web distribution evidence
        uses: actions/upload-artifact@v4
        with:
          name: web-compatibility-distribution
          path: webApp/build/dist/
          if-no-files-found: error
          retention-days: 7

  ios:
    name: ios-framework-and-host
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
          gradle --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Link Kotlin simulator framework
        run: sh ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Generate canonical Xcode project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml
      - name: Build unsigned simulator host
        working-directory: iosApp
        run: |
          xcodebuild \
            -project GymComeTrue.xcodeproj \
            -scheme GymComeTrue \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            build
